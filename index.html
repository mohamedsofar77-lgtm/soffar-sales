<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22337a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مبيعات صفار">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مبيعات صفار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f3f4f7; --surface:#fff; --ink:#1b2033; --muted:#646b80; --line:#dfe2ea;
  --indigo:#2b3f8f; --indigo-soft:#e4e8f6; --greige:#9a8a6c; --greige-soft:#efe9dc;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#b4541c; --warn-soft:#fbe9dd; --bad:#b3261e;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e29; --ink:#e7e9f1; --muted:#9aa0b4; --line:#2c3040;
  --indigo:#8fa2ec; --indigo-soft:#252c4a; --greige:#cbbb98; --greige-soft:#2f2a20;
  --ok:#6cc595; --ok-soft:#1d3327; --warn:#f0965e; --warn-soft:#3a2418; --bad:#f2827b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e29; --ink:#e7e9f1; --muted:#9aa0b4; --line:#2c3040;
  --indigo:#8fa2ec; --indigo-soft:#252c4a; --greige:#cbbb98; --greige-soft:#2f2a20;
  --ok:#6cc595; --ok-soft:#1d3327; --warn:#f0965e; --warn-soft:#3a2418; --bad:#f2827b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;line-height:1.2}
h2{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0}
.sub{color:var(--muted);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--indigo)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label > span{font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.msg{border-radius:10px;padding:10px 12px;font-size:.9rem}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.state{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted)}
.state strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;margin-bottom:4px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login .card{width:min(380px,100%)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.6rem}
/* totals & filters */
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.totals div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.totals .k{font-size:.76rem;color:var(--muted)}
.totals .v{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.totals .v small{font-size:.68rem;color:var(--muted);font-weight:500;margin-inline-start:3px}
.totals .avail .v{color:var(--ok)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:7px;padding:7px 4px;font-weight:500;font-size:.88rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.chip.g{background:var(--greige-soft);color:var(--greige)}
.chip.f{background:var(--indigo-soft);color:var(--indigo)}
.chip.s{border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.st-reserved,.chip.st-requested{background:var(--warn-soft);color:var(--warn)}
.chip.st-sold,.chip.st-delivered,.chip.st-finished{background:var(--ok-soft);color:var(--ok)}
.chip.st-cancelled,.chip.st-closed{border:1px solid var(--line);color:var(--muted)}
.chip.st-returned{background:var(--bad);color:#fff}
.chip.st-partial_return{background:var(--warn-soft);color:var(--bad);border:1px solid var(--bad)}
.ret{background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.ret b{color:var(--bad)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem}
.reasons button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.st-on_machine,.chip.st-greige_done,.chip.st-at_dyehouse{background:var(--indigo-soft);color:var(--indigo)}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.spec-h{padding:12px 14px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line)}
.spec-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.spec-name{font-family:var(--f-display);font-weight:500;font-size:1.02rem}
.code{font-size:.8rem;color:var(--muted)}
.yarn{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line)}
.c:first-child{border-top:0}
.c-name{font-weight:500;overflow-wrap:anywhere}
.c-meta{font-size:.76rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.c-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.c-avail{font-family:var(--f-display);font-weight:700;color:var(--ok);white-space:nowrap}
.c-avail.zero{color:var(--muted)} .c-avail.neg{color:var(--warn)}
.c-avail small{font-size:.68rem;color:var(--muted);font-weight:500}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%} .bar .a{background:var(--ok)} .bar .r{background:var(--warn);opacity:.55}
.c-nums{grid-column:1/-1;font-size:.76rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.flag{color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 6px}
.owner{color:var(--indigo)}
/* list items */
.item{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item-title{font-weight:600;overflow-wrap:anywhere}
.kv{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions input{width:110px;padding:5px 8px}
/* nav */
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 2px 12px;color:var(--muted);font-size:.8rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--indigo)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.picker{border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto}
.picker button{display:block;width:100%;text-align:right;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 12px}
.picker button:first-child{border-top:0}
.picker button:hover{background:var(--indigo-soft)}
.picked{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--indigo-soft);color:var(--indigo);border-radius:10px;padding:8px 12px;font-weight:500}
.avail-box{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:500}
.split{display:flex;flex-direction:column;gap:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{padding:8px 10px;border-top:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:500;border-top:0}
.tbl{overflow-x:auto}
@media (max-width:420px){.totals .v{font-size:1rem}}

/* ===== modern skin (RTL) ===== */
:root{ --radius:18px; --shadow:0 1px 2px rgba(22,28,60,.05),0 8px 24px rgba(22,28,60,.07);
  --hero-a:#22337a; --hero-b:#3f5cc7; --hero-ink:#ffffff; --hero-muted:rgba(255,255,255,.75); --hero-glass:rgba(255,255,255,.14) }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
  --hero-a:#1a2457; --hero-b:#2e428f; --hero-glass:rgba(255,255,255,.1) }}
:root[data-theme="dark"]{ --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3); --hero-a:#1a2457; --hero-b:#2e428f; --hero-glass:rgba(255,255,255,.1) }
html,body{direction:rtl;text-align:right}
body{-webkit-font-smoothing:antialiased}
.wrap{gap:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 22px;color:var(--hero-ink);
  background:radial-gradient(120% 140% at 0% 0%,var(--hero-b) 0%,var(--hero-a) 62%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:auto auto -60px -40px;width:220px;height:220px;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.09) 0 2px,transparent 2px 9px);pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .hello{color:var(--hero-muted);font-size:.85rem}
.hero h1{font-size:1.7rem;color:var(--hero-ink)}
.hero .role{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--hero-glass);border-radius:99px;padding:3px 10px;font-size:.78rem}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;display:grid;place-items:center;background:var(--hero-glass);color:var(--hero-ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.5}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dev{font-size:.8rem;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px}
.totals{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:transparent;border:0;border-radius:0;overflow:visible}
.totals div{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);gap:6px}
.totals .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--indigo-soft);color:var(--indigo)}
.totals .ic svg{width:17px;height:17px}
.totals .res .ic{background:var(--warn-soft);color:var(--warn)}
.totals .avail .ic{background:var(--ok-soft);color:var(--ok)}
.totals .v{font-size:1.3rem}
.seg{border:0;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{border-radius:11px;padding:8px 6px}
.seg button[aria-pressed="true"]{background:var(--indigo);color:#fff}
.search{position:relative}
.search svg{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{padding-right:42px !important;border:0 !important;border-radius:14px !important;box-shadow:var(--shadow);height:48px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{border-radius:12px}
.card,.spec,.state{border:0;border-radius:var(--radius);box-shadow:var(--shadow)}
.state{border:1px dashed var(--line);box-shadow:none}
.spec-h{border-bottom:1px solid var(--line);padding:14px 16px}
.c{padding:12px 16px}
.btn{border-radius:12px}
.btn.primary{box-shadow:0 4px 12px rgba(43,63,143,.25)}
.bar{height:8px;border-radius:4px}
nav.tabs{background:transparent;border:0;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;background:var(--surface);border-radius:22px;box-shadow:0 10px 30px rgba(22,28,60,.18);padding:6px;gap:4px}
nav.tabs button{border-radius:16px;padding:8px 2px}
nav.tabs button[aria-current="page"]{background:var(--indigo-soft);color:var(--indigo)}
/* home */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;border:0;text-align:right;color:var(--ink)}
button.kpi:hover{transform:translateY(-1px)}
.kpi .k{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.kpi .dot svg{width:16px;height:16px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.1}
.kpi .v small{font-size:.75rem;color:var(--muted);font-weight:500;margin-inline-start:4px}
.kpi .s{font-size:.78rem;color:var(--muted)}
.t-g .dot{background:var(--greige-soft);color:var(--greige)}
.t-f .dot{background:var(--indigo-soft);color:var(--indigo)}
.t-r .dot{background:var(--warn-soft);color:var(--warn)}
.t-w .dot{background:var(--ok-soft);color:var(--ok)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.linkbtn{border:0;background:none;color:var(--indigo);font-weight:600;font-size:.85rem;padding:4px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{border:0;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:500;font-size:.82rem;color:var(--ink)}
.quick button span.qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--indigo-soft);color:var(--indigo)}
.quick button svg{width:22px;height:22px}
.top-list .row-i{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.top-list .row-i:first-child{border-top:0}
.swatch{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:.7rem;font-weight:700}
.swatch.g{background:var(--greige-soft);color:var(--greige)}
.swatch.f{background:var(--indigo-soft);color:var(--indigo)}
.row-i .mid{flex:1;min-width:0}
.row-i .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .m{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .a{font-family:var(--f-display);font-weight:700;color:var(--ok);white-space:nowrap;text-align:left}
.row-i .a small{display:block;font-size:.68rem;color:var(--muted);font-weight:500}
@media (max-width:420px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:1.25rem}.totals{gap:8px}.totals div{padding:10px}}
@media (prefers-reduced-motion:reduce){.icon-btn.spin svg{animation:none}}

/* basics */
.bsubs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.bsubs::-webkit-scrollbar{display:none}
.bsubs button{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:99px;padding:8px 16px;font-weight:500;color:var(--muted)}
.bsubs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btools{display:flex;gap:10px;align-items:center}
.btools .btn{white-space:nowrap;height:48px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.82rem;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow[role=button]{cursor:pointer}
.mrow[role=button]:hover{background:var(--indigo-soft)}
.mrow .mid{flex:1;min-width:0}
.mrow .t{font-weight:600;overflow-wrap:anywhere}
.mrow .m{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mrow .yarnline{display:block;margin-top:2px;overflow-wrap:anywhere}
.chev{color:var(--muted);font-size:1.4rem;line-height:1}
.codev{background:var(--indigo-soft);color:var(--indigo);border-radius:6px;padding:0 6px;font-weight:600}
.codebox{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--indigo-soft);color:var(--indigo);border-radius:14px;padding:12px 14px}
.codebox span{font-size:.8rem}
.codebox b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.04em}
.codebox small{flex-basis:100%;color:var(--muted);font-size:.76rem}
.ghead{padding:12px 16px;font-family:var(--f-display);font-weight:500;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.ghead.flat{padding:0;border:0}
.gl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.gl:first-of-type{border-top:0}
.gk{font-weight:600;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.yrow{display:grid;grid-template-columns:70px 90px minmax(0,1fr) 90px auto;gap:8px;align-items:end;background:var(--bg);border-radius:12px;padding:8px}
.yrow input,.yrow select{padding:8px}
.okc{color:var(--ok)} .badc{color:var(--bad)}

.click{cursor:pointer}

/* ============ boot / auth ============ */
async function boot(){
  if (window.claude && window.claude.use) { try { MCP = await window.claude.use("mcp"); } catch(e){ MCP = null; } }
  if (KEY) {
    try{ const w=await rpc("fx_whoami");
      S.me = { role: w.role==="viewer"?"admin":w.role, realRole:w.role, department:w.department, department_name:w.department_name, full_name:w.department_name, email:"", dev:true, preview:w.role==="viewer", owner: KEY===DEV_KEY };
      return renderShell();
    }catch(e){ try{ localStorage.removeItem("soffar_key"); }catch(x){} return renderLogin(/not_allowed/.test(e.message||"")?"الرابط ده مش شغال أو اتقفل. اطلب رابط جديد من الإدارة.":errText(e)); }
  }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  try { S.me = await rpc("fx_me"); } catch(e){ S.me = null; }
  if (!S.me) return renderNoAccess(session.user.email);
  renderShell();
}

/* auto-update: the mobile version checks version.json and reloads itself when a newer build is published */
function startUpdateCheck(){
  if(IN_CLAUDE()||!APP_URL||APP_VERSION==="dev"||location.protocol==="file:"||S._upd) return; S._upd=true;
  const check=async()=>{ try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const j=await r.json(); if(j&&j.version&&j.version!==APP_VERSION) applyUpdate(j.version); }catch(e){} };
  setTimeout(check,4000); setInterval(()=>{ if(!document.hidden) check(); },120000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); });
}
function applyUpdate(v){
  if(S._updating) return;
  const go=()=>{ S._updating=true; location.replace(location.pathname+"?v="+encodeURIComponent(v)); };
  const busy=!!document.querySelector("#sheet .sheet")||!!document.querySelector(".lightbox")||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if(!busy) return go();
  if(!document.getElementById("updbar")){ const b=document.createElement("div"); b.id="updbar"; b.innerHTML='<span>فيه تحديث جديد للتطبيق</span><button class="btn sm primary" type="button">حدّث دلوقتي</button>'; b.querySelector("button").onclick=go; document.body.appendChild(b); }
}

async function loadStock(){
  const j = await rpc("fx_stock");
  const owners=j.owners||{}, specs=j.specs||{};
  S.stock = { at:j.at, rows:(j.rows||[]).map(([w,spec,ck,cn,own,pcs,tot,res])=>{
    const sp = specs[spec]||["","",""]; const free = !own;
    const ownerName = free ? "مخزون صفار" : (owners[own]||"عميل مش في القائمة");
    return { w, spec, ck, cn:cn||"", own, free, ownerName, pcs:+pcs||0, tot:+tot||0, res:+res||0, av:(+tot||0)-(+res||0),
      sname:sp[0]||"صنف بدون اسم", season:sp[1]||"", yarn:sp[2]||"",
      key:norm([spec,sp[0],ck.startsWith("N:")?"":ck,cn,ownerName].join(" ")) };
  })};
}

  if($("#vers")) $("#vers").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.f.spec=b.dataset.k;S.f.limit=40;drawStock()};
  if(!S.stock){ try{ await loadStock(); }catch(e){ $("#slist").innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; return; } }
  drawStock();
}
function drawStock(){
  if(!S.stock||!$("#slist")) return;
  const canReserve = S.me.role==="sales"||S.me.role==="admin";
  const terms=norm(S.f.q).split(" ").filter(Boolean);
  const base=(r)=>(S.f.wh==="all"||(S.f.wh==="greige"?r.w==="g":r.w==="f"))&&(S.f.own==="all"||(S.f.own==="free"?r.free:!r.free))
     &&(!S.f.mat||String(r.spec).startsWith(S.f.mat))&&(!S.f.season||r.season===S.f.season)&&terms.every(t=>r.key.includes(t));
  if($("#vers")){ const vm=new Map(); S.stock.rows.forEach(r=>{ if(!base(r)) return; const x=vm.get(r.spec)||{av:0}; if(r.free) x.av+=Math.max(0,r.av); vm.set(r.spec,x); });
    if(S.f.spec&&!vm.has(S.f.spec)) S.f.spec="";
    $("#vers").innerHTML=`<button data-k="" aria-pressed="${!S.f.spec}">الكل</button>`+[...vm.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([sp,x])=>`<button data-k="${esc(sp)}" aria-pressed="${S.f.spec===sp}"><span class="num">${esc(sp.slice(5)||sp)}</span> · <span class="num">${fmt(x.av)}</span> كجم</button>`).join(""); }
  const idx=[]; S.stock.rows.forEach((r,i)=>{ if(base(r)&&(!S.f.spec||r.spec===S.f.spec)) idx.push(i); }); S.lastIdx=idx;
  let tot=0,res=0,av=0; const groups=new Map();
  for(const i of idx){ const r=S.stock.rows[i]; tot+=r.tot; res+=r.res; if(r.free) av+=Math.max(0,r.av);
    const k=r.w+"|"+r.spec; let g=groups.get(k); if(!g){g={w:r.w,spec:r.spec,sname:r.sname,season:r.season,yarn:r.yarn,tot:0,av:0,items:[]};groups.set(k,g)}
    g.tot+=r.tot; if(r.free) g.av+=Math.max(0,r.av); g.items.push(i); }
  $("#t1").textContent=fmt(tot); $("#t2").textContent=fmt(res); $("#t3").textContent=fmt(av);
  const sorters={av:(a,b)=>b.av-a.av||b.tot-a.tot, tot:(a,b)=>b.tot-a.tot, code:(a,b)=>String(a.spec).localeCompare(String(b.spec)), name:(a,b)=>a.sname.localeCompare(b.sname,"ar")};
  const list=[...groups.values()].sort(sorters[S.f.sort]||sorters.av);
  $("#cnt").textContent = list.length?`${list.length.toLocaleString("en-US")} صنف · ${idx.length.toLocaleString("en-US")} لون · آخر تحديث ${dt(S.stock.at)}`:"";
  if(!list.length){ $("#slist").innerHTML=`<div class="state"><strong>مفيش رصيد مطابق</strong>جرّب تشيل كلمة من البحث أو تغيّر الفلتر.</div>`; $("#more").hidden=true; return; }
  $("#slist").innerHTML = list.slice(0,S.f.limit).map(g=>{
    g.items.sort((a,b)=>S.stock.rows[b].av-S.stock.rows[a].av);
    return `<article class="spec"><div class="spec-h click" data-openmat="${esc(String(g.spec).slice(0,5))}" data-spec="${esc(g.spec)}" role="button" tabindex="0" title="${S.f.mat?"اعرض الإصدار ده بس":"افتح صفحة الخامة"}"><div class="spec-top"><span class="chip ${g.w}">${g.w==="g"?"خام":"مجهز"}</span><span class="spec-name">${esc(g.sname)}</span><span class="code num">${esc(g.spec)}</span>${g.season?`<span class="chip s">${esc(g.season)}</span>`:""}</div>${g.yarn?`<div class="yarn">${esc(g.yarn)}</div>`:""}
      <div class="spec-act"><button class="btn sm" data-share="${esc(g.w+"|"+g.spec)}">${ICONS.share} شارك</button>${canReserve&&g.av>=0.5?`<button class="btn sm primary" data-multi="${esc(g.w+"|"+g.spec)}">حجز ألوان</button>`:""}</div></div>
    <div>${g.items.map(i=>{const r=S.stock.rows[i];
      const pa=r.tot>0?Math.max(0,Math.min(1,r.av/r.tot))*100:0, pr=r.tot>0?Math.min(1,r.res/r.tot)*100:0;
      const cls=r.av<-0.5?"neg":(r.av<0.5?"zero":"");
      return `<div class="c click" data-i="${i}" role="button" tabindex="0"><div><div class="c-name">${swatch(r)}${esc(r.cn||"بدون لون")}</div><div class="c-meta">${!r.ck.startsWith("N:")?`<span class="num">${esc(r.ck)}</span>`:""}${!r.free?`<span class="owner">${esc(r.ownerName)}</span>${cd(r.own)}`:""}</div></div>
      <div class="c-side">${r.free?`<div class="c-avail ${cls}"><span class="num">${fmt(Math.max(0,r.av))}</span> <small>كجم متاح</small></div>${canReserve&&r.av>=0.5?`<button class="btn sm primary" data-reserve="${i}">احجز</button>`:""}`:`<span class="chip s">بضاعة عميل</span>`}</div>
      <div class="bar" aria-hidden="true"><i class="a" style="width:${r.free?pa:0}%"></i><i class="r" style="width:${pr}%"></i></div>
      <div class="c-nums"><span>موجود <span class="num">${fmt(r.tot)}</span></span><span>محجوز <span class="num">${fmt(r.res)}</span></span><span><span class="num">${r.pcs.toLocaleString("en-US")}</span> توب</span>${cls==="neg"&&r.free?`<span class="flag">الحجز أكبر من الموجود بـ <span class="num">${fmt(-r.av)}</span></span>`:""}</div></div>`}).join("")}</div></article>`}).join("");
  const left=list.length-S.f.limit; $("#more").hidden=left<=0; if(left>0) $("#more").textContent=`عرض أصناف أكتر (${left.toLocaleString("en-US")} باقيين)`;
}

/* ============ pickers ============ */
async function ensureCustomers(){ if(!S.customers) S.customers=(await rpc("fx_customers")||[]).map(([code,name])=>({code,name,key:norm(name+" "+code)})); }
async function ensureSpecs(){ if(!S.specs) S.specs=(await rpc("fx_specs")||[]).map(([code,name,season,yarn])=>({code,name,season,yarn,key:norm(code+" "+name+" "+(yarn||""))})); }
function picker(container, items, label, placeholder, onPick, recent){
  let picked=null;
  const draw=()=>{
    if(picked){ container.innerHTML=`<div class="picked"><span>${esc(label(picked))}</span><button type="button" class="btn sm">تغيير</button></div>`;
      container.querySelector("button").onclick=()=>{picked=null;onPick(null);draw();container.querySelector("input").focus()}; return; }
    container.innerHTML=`<input type="search" placeholder="${esc(placeholder)}"><div class="picker" hidden></div>`;
    const inp=container.querySelector("input"), box=container.querySelector(".picker");
    const showRecent=()=>{ const rc=(recent||[]).map(c=>items.find(x=>x.code===c)).filter(Boolean); if(!rc.length){box.hidden=true;return}
      box.hidden=false; box.innerHTML=`<div class="sub" style="padding:6px 12px">آخر العملاء</div>`+rc.map(x=>`<button type="button" data-i="${items.indexOf(x)}">${esc(label(x))}</button>`).join(""); };
    inp.onfocus=()=>{ if(!inp.value.trim()) showRecent(); };
    inp.oninput=()=>{const t=norm(inp.value).split(" ").filter(Boolean); if(!t.length){showRecent();return}
      const hits=items.filter(x=>t.every(w=>x.key.includes(w))).slice(0,30);
      box.hidden=false; box.innerHTML=hits.length?hits.map((x,i)=>`<button type="button" data-i="${items.indexOf(x)}">${esc(label(x))}</button>`).join(""):`<div class="sub" style="padding:8px 12px">مفيش نتيجة</div>`; };
    box.onclick=e=>{const b=e.target.closest("button");if(!b)return;picked=items[+b.dataset.i];onPick(picked);draw()};
  };
  draw();
}
function sheet(html){ $("#sheet").innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#sheet .sheet-bg").onclick=e=>{ if(e.target.classList.contains("sheet-bg")) closeSheet(); }; }
function closeSheet(){ $("#sheet").innerHTML=""; }

/* ============ reserve ============ */
async function openReserve(r){
  sheet(`<div class="state">بيحمّل العملاء…</div>`);
  try{ await ensureCustomers(); }catch(e){ sheet(`<div class="msg err">${esc(errText(e))}</div><button class="btn" onclick="closeSheet()">قفل</button>`); return; }
  let cust=null;
  sheet(`<h2>حجز ${esc(r.sname)}</h2>
   <div class="kv"><span class="chip ${r.w}">${r.w==="g"?"خام":"مجهز"}</span><span class="num">${esc(r.spec)}</span><b>${esc(r.cn||"بدون لون")}</b></div>
   <div class="avail-box"><span>المتاح دلوقتي</span><span><span class="num">${fmt2(Math.max(0,r.av))}</span> كجم</span></div>
   <label><span>العميل</span><div id="cp"></div></label>
   <div class="row"><label class="grow"><span>الكمية (كجم)</span><input type="number" id="rq" min="0" step="0.01" inputmode="decimal"></label>
   <label style="width:120px"><span>السماح ±%</span><input type="number" id="rt" value="5" min="0" max="50" step="1" inputmode="numeric"></label></div>
   <label><span>ملاحظة</span><input type="text" id="rn" placeholder="اختياري"></label>
   <div><div class="flabel">صور الديزاين أو العينة (اختياري)</div><div id="rimg"></div></div>
   <div id="rmsg"></div>
   <div class="row"><button class="btn primary grow" id="rgo">احجز</button><button class="btn" id="rx">إلغاء</button></div>`);
  picker($("#cp"), S.customers, x=>`${x.name} · ${x.code}`, "اكتب اسم العميل أو كوده", p=>cust=p, recentCustomers());
  const rip=imgPicker($("#rimg"),"صورة الديزاين");
  $("#rx").onclick=closeSheet;
  $("#rgo").onclick=async()=>{
    const q=parseFloat($("#rq").value), tol=parseFloat($("#rt").value)||0, note=$("#rn").value.trim()||null, m=$("#rmsg");
    if(!cust){ m.innerHTML=`<div class="msg err">اختار العميل الأول.</div>`; return; }
    if(!(q>0)){ m.innerHTML=`<div class="msg err">اكتب الكمية بالكيلو.</div>`; return; }
    const avail=Math.max(0,r.av);
    if(q>avail+0.001){
      const short=+(q-avail).toFixed(2);
      m.innerHTML=`<div class="split"><div class="msg err">الكمية أكبر من المتاح. المتاح <span class="num">${fmt2(avail)}</span> والناقص <span class="num">${fmt2(short)}</span> كجم.</div>
        ${avail>=0.5?`<button class="btn primary" id="opt1">احجز المتاح واطلب تشغيل الناقص</button>`:""}
        <button class="btn" id="opt2">اطلب تشغيل الكمية كلها (<span class="num">${fmt2(q)}</span> كجم)</button></div>`;
      const run=async(resQty, woQty)=>{
        m.querySelectorAll("button").forEach(b=>b.disabled=true);
        try{
          let resId=null;
          if(resQty>0){ const x=await rpc("fx_reserve",{p_customer:cust.code,p_warehouse:r.w==="g"?"greige":"finished",p_spec:r.spec,p_ckey:r.ck,p_qty:resQty,p_tolerance:tol,p_note:note});
            if(!x.ok){ m.innerHTML=`<div class="msg err">المتاح اتغير وبقى <span class="num">${fmt2(x.available)}</span> كجم. حدّث وجرب تاني.</div>`; return; } resId=x.id;
            if(rip.get().length) await uploadImages("reservation",resId,rip.get(),"ديزاين"); }
          const w=await rpc("fx_request_production",{p_customer:cust.code,p_spec:r.spec,p_color:r.cn,p_qty:woQty,p_warehouse_target:r.w==="g"?"greige":"finished",p_note:note,p_reservation_id:resId});
          if(rip.get().length) await uploadImages("wo",w.id,rip.get(),"ديزاين"); rememberCustomer(cust.code);
          done(`${resQty>0?`اتحجز <span class="num">${fmt2(resQty)}</span> كجم، و`:""}اتعمل طلب تشغيل <span class="num">${esc(w.wo_no)}</span> بـ <span class="num">${fmt2(woQty)}</span> كجم لـ ${esc(cust.name)}.`);
        }catch(e){ m.innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; }
      };
      if($("#opt1")) $("#opt1").onclick=()=>run(+avail.toFixed(2), short);
      $("#opt2").onclick=()=>run(0, q);
      return;
    }
    $("#rgo").disabled=true;
    try{
      const x=await rpc("fx_reserve",{p_customer:cust.code,p_warehouse:r.w==="g"?"greige":"finished",p_spec:r.spec,p_ckey:r.ck,p_qty:q,p_tolerance:tol,p_note:note});
      if(!x.ok){ r.av=x.available; m.innerHTML=`<div class="msg err">المتاح اتغير وبقى <span class="num">${fmt2(x.available)}</span> كجم.</div>`; $("#rgo").disabled=false; return; }
      if(rip.get().length) await uploadImages("reservation",x.id,rip.get(),"ديزاين"); rememberCustomer(cust.code);
      done(`اتحجز <span class="num">${fmt2(q)}</span> كجم لـ ${esc(cust.name)}. المتاح دلوقتي <span class="num">${fmt2(x.available_after)}</span> كجم.`);
    }catch(e){ m.innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; $("#rgo").disabled=false; }
  };
  const done=html=>{ S.stock=null; sheet(`<div class="msg ok">${html}</div><button class="btn primary" id="dok">تمام</button>`); $("#dok").onclick=()=>{closeSheet(); show();}; };
}

   <div class="row"><label class="grow"><span>ملاحظة</span><input type="text" id="nn" placeholder="اختياري"></label><label class="grow"><span>مطلوب يتسلّم يوم</span><input type="date" id="ndue"></label></div>

/* ============ reservations ============ */
async function viewRes(){
  const v=$("#view");
  v.innerHTML=header("الحجوزات",refreshBtn())+`
  <div class="seg" id="rseg">${[["reserved","مفتوحة"],["sold","اتباعت"],["expired","انتهت"],["cancelled","ملغية"],["all","الكل"]].map(([k,l])=>`<button data-k="${k}" aria-pressed="${S.resFilter===k}">${l}</button>`).join("")}</div>
  <div class="card" id="rlist"><div class="state">بيحمّل…</div></div>`; bindHeader();
  $("#rseg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.resFilter=b.dataset.k;viewRes()};
  $("#rf").onclick=()=>viewRes();
  let list; try{ try{ await rpc("fx_expire_reservations"); }catch(e){} list=await rpc("fx_reservations",{p_status:S.resFilter}); }catch(e){ $("#rlist").innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; return; }
  if(!list.length){ $("#rlist").outerHTML=`<div class="state"><strong>مفيش حجوزات هنا</strong>${S.resFilter==="reserved"?"احجز من شاشة الرصيد بزرار «احجز» جنب اللون.":""}</div>`; return; }
  const role=S.me.role;
  $("#rlist").innerHTML=list.map(r=>{
    const canAct = r.status==="reserved" && (role==="admin"||role==="warehouse"||r.mine);
    const canCancel = r.status==="reserved" && (role==="admin"||r.mine);
    const max = r.qty*(1+r.tolerance_pct/100), min=r.qty*(1-r.tolerance_pct/100);
    return `<div class="item" data-id="${r.id}">
      <div class="item-top"><div class="item-title">${esc(r.customer_name||"")} ${cd(r.customer_code)}</div><span class="chip st-${r.status}">${RES_ST[r.status]||r.status}</span></div>
      <div class="kv"><span class="chip ${r.warehouse==="greige"?"g":"f"}">${r.warehouse==="greige"?"خام":"مجهز"}</span><b>${esc(r.spec_name||"")}</b><span class="num">${esc(r.spec_code)}</span><span>${esc(r.color_name||"")}</span></div>
      <div class="kv"><span>الكمية <b class="num">${fmt2(r.qty)}</b> كجم ±<span class="num">${fmt2(r.tolerance_pct)}</span>%</span>${r.status==="sold"?`<span>اتسلّم <b class="num">${fmt2(r.delivered_qty)}</b> كجم</span>`:""}<span>${esc(r.sales_name||"")}</span><span>${dt(r.created_at)}</span>${r.images?`<span>${ICONS.camera} ${r.images}</span>`:""}${expChip(r)}</div>
      ${r.note?`<div class="kv">${esc(r.note)}</div>`:""}
      ${canAct?`<div class="actions"><input type="number" step="0.01" inputmode="decimal" value="${+(+r.qty).toFixed(2)}" aria-label="الكمية المسلّمة" data-q><button class="btn sm ok" data-sell>سلّم وحوّل لأمر بيع</button>${canCancel?`<button class="btn sm" data-extend>مد 7 أيام</button><button class="btn sm danger" data-cancel>إلغاء الحجز</button>`:""}</div>
      <div class="sub">مسموح من <span class="num">${fmt2(min)}</span> لحد <span class="num">${fmt2(max)}</span> كجم</div><div data-m></div>`:""}
    </div>`}).join("");
  $("#rlist").onclick=async e=>{
    const it=e.target.closest(".item"); if(!it) return; const id=+it.dataset.id, m=it.querySelector("[data-m]");
    if(!e.target.closest(".actions,button,input,select")){ openResDetail(list.find(x=>x.id===id)); return; }
    if(e.target.closest("[data-sell]")){
      const q=parseFloat(it.querySelector("[data-q]").value); if(!(q>0)){ m.innerHTML=`<div class="msg err">اكتب الكمية اللي اتسلمت.</div>`; return; }
      e.target.disabled=true;
      try{ const x=await rpc("fx_deliver_reservation",{p_id:id,p_qty:q}); if(!x.ok){ m.innerHTML=`<div class="msg err">أقصى كمية مسموح بيها <span class="num">${fmt2(x.max)}</span> كجم.</div>`; e.target.disabled=false; return; }
        S.stock=null; viewRes(); }catch(err){ m.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`; e.target.disabled=false; }
    }
    if(e.target.closest("[data-extend]")){ try{ await rpc("fx_extend_reservation",{p_id:id,p_days:7}); toast("الحجز اتمد 7 أيام"); viewRes(); }catch(err){ m.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`; } return; }
    if(e.target.closest("[data-cancel]")){
      const b=e.target.closest("[data-cancel]");
      if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="متأكد؟ دوس تاني للإلغاء"; return; }
      b.disabled=true;
      try{ await rpc("fx_cancel_reservation",{p_id:id}); S.stock=null; viewRes(); }catch(err){ m.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`; b.disabled=false; }
    }
  };
}

function expChip(r){ if(r.status!=="reserved"||!r.expires_at) return ""; const d=(new Date(r.expires_at)-Date.now())/864e5;
  if(d<0) return `<span class="chip st-returned">انتهى</span>`; if(d<1) return `<span class="chip st-partial_return">بينتهي النهارده</span>`;
  return `<span class="chip ${d<2?"st-partial_return":"s"}">باقي ${Math.ceil(d)} يوم</span>`; }

async function viewWO(){
  const v=$("#view");
  v.innerHTML=header("أوامر التشغيل",refreshBtn())+`
  <div class="seg" id="wseg"><button data-k="1" aria-pressed="${S.woOpen}">المفتوحة</button><button data-k="0" aria-pressed="${!S.woOpen}">الكل</button></div>
  <div class="search">${ICONS.search}<input type="search" id="wq" placeholder="ابحث برقم الأمر أو العميل أو الصنف"></div>
  <div class="card" id="wlist"><div class="state">بيحمّل…</div></div>`; bindHeader();
  $("#wseg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.woOpen=b.dataset.k==="1";viewWO()};
  $("#rf").onclick=()=>viewWO();
  let list; try{ list=await rpc("fx_work_orders",{p_open_only:S.woOpen}); }catch(e){ $("#wlist").innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; return; }
  const canEdit = ["admin","warehouse","planning"].includes(S.me.role);
  const draw=()=>{
    const t=norm($("#wq").value).split(" ").filter(Boolean);
    const rows=list.filter(w=>t.every(x=>norm([w.wo_no,w.customer_name,w.spec_name,w.spec_code,w.color].join(" ")).includes(x)));
    if(!rows.length){ $("#wlist").innerHTML=`<div class="state"><strong>مفيش أوامر هنا</strong></div>`; return; }
    $("#wlist").innerHTML=rows.map(w=>{const left=(+w.qty_required)-(+w.qty_delivered||0); return `<div class="item" data-id="${w.id}">
      <div class="item-top"><div class="item-title"><span class="num">${esc(w.wo_no)}</span> · ${esc(w.customer_name||"")} ${cd(w.customer_code)}</div><span class="row" style="gap:6px">${w.overdue?`<span class="chip st-returned">متأخر</span>`:""}<span class="chip st-${w.status}">${WO_ST[w.status]||w.status}</span></span></div>
      <div class="kv"><b>${esc(w.spec_name||"")}</b><span class="num">${esc(w.spec_code)}</span><span>${esc(w.color||"")}</span>${w.due_date?`<span class="${w.overdue?"badc":""}">التسليم ${new Date(w.due_date).toLocaleDateString("ar-EG",{day:"numeric",month:"short"})}</span>`:""}${w.images?`<span>${ICONS.camera} ${w.images}</span>`:""}${w.warehouse_target?`<span class="chip ${w.warehouse_target==="greige"?"g":"f"}">${w.warehouse_target==="greige"?"يتسلم خام":"يتسلم مجهز"}</span>`:""}</div>
      <div class="kv"><span>المطلوب <b class="num">${fmt(w.qty_required)}</b></span><span>اتسلّم <b class="num">${fmt(w.qty_delivered)}</b></span><span>الباقي <b class="num">${fmt(left)}</b> كجم</span>${+w.qty_returned?`<span>مرتجع <b class="num badc">${fmt(w.qty_returned)}</b> كجم</span>`:""}${w.requested_by_name?`<span>${esc(w.requested_by_name)} · ${dt(w.created_at)}</span>`:""}</div>
      ${w.note?`<div class="kv">${esc(w.note)}</div>`:""}
      ${(w.returns||[]).length?`<div class="ret">${w.returns.map(r=>`<div><b class="num">${fmt2(r.qty)}</b> كجم · ${esc(r.reason)}${r.note?` · ${esc(r.note)}`:""} <span class="sub">${dt(r.at)}</span></div>`).join("")}</div>`:""}
      ${canEdit?`<div class="actions"><select data-st aria-label="حالة الأمر">${Object.entries(WO_ST).filter(([k])=>!["partial_return","returned"].includes(k)||k===w.status).map(([k,l])=>`<option value="${k}" ${k===w.status?"selected":""}>${l}</option>`).join("")}</select>${(+w.qty_returned)<(+w.qty_required)-0.001?`<button class="btn sm danger" data-ret>تسجيل مرتجع</button>`:""}</div><div data-m></div>`:""}
    </div>`}).join("");
  };
  $("#wq").oninput=draw; draw();
  $("#wlist").onclick=e=>{ const it=e.target.closest(".item"); if(!it) return; const w=list.find(x=>x.id==it.dataset.id);
    if(e.target.closest("[data-ret]")){ openReturn(w); return; }
    if(!e.target.closest(".actions,button,select,input")) openWODetail(w); };
  $("#wlist").onchange=async e=>{const s=e.target.closest("[data-st]");if(!s)return;const it=s.closest(".item"),m=it.querySelector("[data-m]");s.disabled=true;
    try{ await rpc("fx_set_work_order_status",{p_id:+it.dataset.id,p_status:s.value}); const w=list.find(x=>x.id==it.dataset.id); w.status=s.value; draw(); }
    catch(err){ m.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`; s.disabled=false; } };
}

function openReturn(w){
  const max=+(+w.qty_required-(+w.qty_returned||0)).toFixed(2);
  let reason="", mode="all";
  sheet(`<h2>تسجيل مرتجع</h2>
   <div class="kv"><b class="num">${esc(w.wo_no)}</b><span>${esc(w.customer_name||"")} ${cd(w.customer_code)}</span><span>${esc(w.spec_name||"")} ${cd(w.spec_code)}</span><span>${esc(w.color||"")}</span></div>
   <div class="kv"><span>المطلوب <b class="num">${fmt2(w.qty_required)}</b></span>${+w.qty_returned?`<span>اترجع قبل كده <b class="num">${fmt2(w.qty_returned)}</b></span>`:""}<span>أقصى مرتجع <b class="num">${fmt2(max)}</b> كجم</span></div>
   <div class="seg" id="rmode"><button data-k="all" aria-pressed="true">الكمية كلها</button><button data-k="part" aria-pressed="false">جزء من الكمية</button></div>
   <label><span>الكمية المرتجعة (كجم)</span><input type="number" id="rqty" value="${max}" step="0.01" inputmode="decimal" readonly></label>
   <div><div class="sub" style="margin-bottom:6px">السبب</div><div class="reasons" id="rrs">${RETURN_REASONS.map(r=>`<button type="button" data-r="${esc(r)}" aria-pressed="false">${esc(r)}</button>`).join("")}<button type="button" data-r="__other" aria-pressed="false">سبب تاني…</button></div></div>
   <label id="rotw" hidden><span>اكتب السبب</span><input type="text" id="rother"></label>
   <label><span>المسؤول عن المرتجع (المصبغة أو المورد)</span><select id="rsup"><option value="">مش محدد</option></select></label>
   <label><span>تفاصيل</span><input type="text" id="rnote" placeholder="اختياري: مثلاً رقم إذن المرتجع"></label>
   <div><div class="flabel">صور العيب</div><div id="rpics"></div></div>
   <div id="rm"></div><div class="row"><button class="btn primary grow" id="rgo">سجّل المرتجع</button><button class="btn" id="rx">إلغاء</button></div>`);
  $("#rmode").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.k;$("#rmode").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const q=$("#rqty"); if(mode==="all"){q.value=max;q.readOnly=true}else{q.value="";q.readOnly=false;q.focus()} };
  $("#rrs").onclick=e=>{const b=e.target.closest("button");if(!b)return;reason=b.dataset.r;$("#rrs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#rotw").hidden=reason!=="__other"};
  $("#rx").onclick=closeSheet;
  const rpp=imgPicker($("#rpics"),"صوّر العيب");
  master("suppliers").then(sp=>{ const sel=$("#rsup"); if(sel) sel.insertAdjacentHTML("beforeend", sp.map(s=>`<option value="${esc(s[0])}">${esc(s[1])} · ${esc(s[2])}</option>`).join("")); }).catch(()=>{});
  $("#rgo").onclick=async()=>{
    const q=parseFloat($("#rqty").value), r=reason==="__other"?$("#rother").value.trim():reason, m=$("#rm");
    if(!(q>0)) return m.innerHTML=`<div class="msg err">اكتب الكمية المرتجعة.</div>`;
    if(q>max+0.001) return m.innerHTML=`<div class="msg err">أقصى كمية ممكن ترجع <span class="num">${fmt2(max)}</span> كجم.</div>`;
    if(!r) return m.innerHTML=`<div class="msg err">اختار سبب المرتجع.</div>`;
    $("#rgo").disabled=true;
    try{ const x=await rpc("fx_wo_return",{p_id:w.id,p_qty:q,p_reason:r,p_note:$("#rnote").value.trim()||null,p_supplier:$("#rsup").value||null});
      if(!x.ok){ m.innerHTML=`<div class="msg err">أقصى كمية ممكن ترجع <span class="num">${fmt2(x.max)}</span> كجم.</div>`; $("#rgo").disabled=false; return; }
      if(rpp.get().length) await uploadImages("return",x.return_id,rpp.get(),r);
      closeSheet(); toast(x.status==="returned"?"اتسجل مرتجع كلي":`اتسجل مرتجع جزئي، إجمالي المرتجع ${fmt2(x.returned)} كجم`); viewWO();
    }catch(e){ m.innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; $("#rgo").disabled=false; } };
}

/* ============ basics (master data & coding) ============ */
S.m = {}; S.bTab = "customers"; S.bQ = ""; S.bFlag = false; S.bLimit = 60; S.bMat = "";

const NEEDS_FIX = n => /راجع|تصحيح|حذف|مراجعة/.test(n||"");
async function master(kind, force){ if(force||!S.m[kind]) S.m[kind]= kind==="colors_lib" ? await rpc("fx_colors") : await rpc("fx_master",{p_kind:kind}); return S.m[kind]; }
function dropMaster(...k){ k.forEach(x=>delete S.m[x]); delete S.m.guide; S.customers=null; S.specs=null; }

async function viewBasics(){

  catch(e){ box.innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; }
}

function toolbar(placeholder, addLabel, extra=""){
  return `<div class="btools"><div class="search grow">${ICONS.search}<input type="search" id="bq" placeholder="${esc(placeholder)}" value="${esc(S.bQ)}"></div>
    ${isAdmin()&&addLabel?`<button class="btn primary" id="badd">+ ${esc(addLabel)}</button>`:""}</div>
    <div class="row">${extra}<span class="sub" id="bcnt"></span></div>`;
}
function bindToolbar(draw){
  let t; $("#bq").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S.bQ=e.target.value;S.bLimit=60;draw()},150)};
  const f=$("#bflag"); if(f) f.onclick=()=>{S.bFlag=!S.bFlag;f.setAttribute("aria-pressed",S.bFlag);S.bLimit=60;draw()};
}
const flagBtn = n => `<button class="pill" id="bflag" aria-pressed="${S.bFlag}">محتاج تصحيح (${n})</button>`;
const moreBtn = left => left>0?`<button class="btn" data-more>عرض أكتر (${left.toLocaleString("en-US")} باقيين)</button>`:"";

/* ---- customers ---- */
async function bCustomers(box){
  const list=await master("customers");
  const rows=list.map(([code,name,note,rolls,wos])=>({code,name,note,rolls,wos,tmp:!/^\d+$/.test(code),key:norm(code+" "+name)}));
  const fixN=rows.filter(r=>r.tmp||NEEDS_FIX(r.note)||r.name==="حذف").length;
  box.innerHTML = toolbar("ابحث باسم العميل أو الكود","عميل جديد", flagBtn(fixN)) + `<div class="card" id="blist"></div><div id="bmore"></div>`;
  const draw=()=>{
    const t=norm(S.bQ).split(" ").filter(Boolean);
    const f=rows.filter(r=>t.every(w=>r.key.includes(w)) && (!S.bFlag || r.tmp||NEEDS_FIX(r.note)||r.name==="حذف"));
    $("#bcnt").textContent=`${f.length.toLocaleString("en-US")} عميل`;
    $("#blist").innerHTML = f.length ? f.slice(0,S.bLimit).map(r=>`<div class="mrow click" data-code="${esc(r.code)}" role="button" tabindex="0">
      <div class="mid"><div class="t">${esc(r.name)} ${cd(r.code)}</div>
        <div class="m">${r.tmp?`<span class="flag">كود مؤقت</span>`:""}${r.note?`<span class="flag">${esc(r.note)}</span>`:""}${r.rolls?`<span>${r.rolls} سطر مخزن</span>`:""}${r.wos?`<span>${r.wos} أمر شغل</span>`:""}</div></div>
      ${isAdmin()?`<div class="actions">${r.tmp?`<button class="btn sm primary" data-recode>كوّده</button>`:""}<button class="btn sm" data-edit>تعديل</button></div>`:""}
    </div>`).join("") : `<div class="state"><strong>مفيش نتايج</strong></div>`;
    $("#bmore").innerHTML=moreBtn(f.length-S.bLimit);
  };
  bindToolbar(draw); draw();
  $("#bmore").onclick=e=>{if(e.target.closest("[data-more]")){S.bLimit+=60;draw()}};
  if($("#badd")) $("#badd").onclick=()=>editCustomer(null);
  $("#blist").onclick=async e=>{
    const row=e.target.closest(".mrow"); if(!row) return; const r=rows.find(x=>x.code===row.dataset.code);
    if(e.target.closest("[data-edit]")) return editCustomer(r);
    if(!e.target.closest("button")) return openCustomerDetail(r.code);
    const b=e.target.closest("[data-recode]"); if(b){
      if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="متأكد؟ دوس تاني"; return; }
      b.disabled=true;
      try{ const x=await rpc("fx_recode_customer",{p_old:r.code}); dropMaster("customers"); S.stock=null; toast(`${r.name} اتكوّد بالكود ${x.code}`); viewBasics(); }
      catch(err){ toast(errText(err),true); b.disabled=false; }
    }
  };
}

function toast(text, bad){
  let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }

/* ============ images ============ */
const IN_CLAUDE = () => !!MCP;
function loadImg(file){ return new Promise((ok,bad)=>{ const fr=new FileReader(); fr.onerror=()=>bad(new Error("الصورة مش بتتقري")); fr.onload=()=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>bad(new Error("الملف ده مش صورة")); im.src=fr.result; }; fr.readAsDataURL(file); }); }
function shrink(im, max, q){ const sc=Math.min(1, max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); }
async function prepImage(file){ const im=await loadImg(file); let data=shrink(im,1100,.78); if(data.length>650000) data=shrink(im,900,.66); if(data.length>650000) data=shrink(im,700,.6);
  return { thumb:shrink(im,180,.7), data }; }
/* a small control to pick one or more photos (camera on phones) */
function imgPicker(box, label="ضيف صور"){
  const files=[];
  const draw=()=>{ box.innerHTML=`<div class="ipick">${files.map((f,i)=>`<div class="ith"><img src="${f.thumb}" alt=""><button type="button" data-x="${i}" aria-label="شيل الصورة">✕</button></div>`).join("")}
     <label class="iadd">${ICONS.camera}<span>${esc(label)}</span><input type="file" accept="image/*" multiple hidden></label></div>`;
    box.querySelector("input").onchange=async e=>{ for(const f of e.target.files){ try{ files.push(await prepImage(f)); }catch(err){ toast(err.message,true); } } draw(); };
    box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ files.splice(+b.dataset.x,1); draw(); }); };
  draw();
  return { get:()=>files.slice(), clear:()=>{ files.length=0; draw(); } };
}
async function uploadImages(kind, ref, files, caption){ let n=0; for(const f of files){ await rpc("fx_image_add",{p_kind:kind,p_ref:String(ref),p_thumb:f.thumb,p_data:f.data,p_caption:caption||null}); n++; } return n; }

async function gallery(box, kind, ref, opts={}){

    ${!list.length&&opts.canAdd===false?`<div class="sub">مفيش صور.</div>`:""}`;
  box.querySelectorAll(".gth").forEach(b=>b.onclick=()=>viewImage(+b.dataset.id, ()=>gallery(box,kind,ref,opts)));

function shareText(rows, heading){
  const groups=new Map();
  rows.filter(r=>r.free&&r.av>=0.5).forEach(r=>{ const k=r.w+"|"+r.spec; if(!groups.has(k)) groups.set(k,{r,items:[]}); groups.get(k).items.push(r); });
  let t=`${heading}\nمصنع صفار — المتاح للبيع (${new Date().toLocaleDateString("ar-EG")})\n`;
  for(const {r,items} of groups.values()){
    t+=`\n▪️ ${r.sname} (${r.spec}) — ${WH_AR(r.w)}${r.season?" — "+r.season:""}\n`;
    items.sort((a,b)=>b.av-a.av).forEach(x=>{ t+=`   • ${x.cn||"بدون لون"}${!x.ck.startsWith("N:")?" ["+x.ck+"]":""}: ${fmt(x.av)} كجم\n`; });
  }
  return t.trim();
}

/* ============ barcode scanning (iPhone + Android) ============ */
const canScan = () => !IN_CLAUDE() && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;
async function loadScanLib(){ if(window.Html5Qrcode) return;
  await new Promise((ok,bad)=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"; sc.onload=ok; sc.onerror=()=>bad(new Error("مكتبة السكان مش بتحمّل، اتأكد من النت")); document.head.appendChild(sc); }); }
async function openScanner(onCode, title){
  const ov=document.createElement("div"); ov.className="scanov";
  ov.innerHTML=`<div class="scanhead"><b>${esc(title||"سكان الباركود")}</b><span class="scnt"><span class="num" id="scnt">0</span> توب</span></div>
    <div id="scanreg"></div><div id="scmsg" class="scmsg">وجّه الكاميرا على الباركود. السكان شغال على طول، امسح التوب ورا التاني.</div>
    <div class="sclog" id="sclog"></div><button class="btn primary" id="scdone" type="button">خلصت</button>`;
  document.body.appendChild(ov);
  let ac=null; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  const beep=ok=>{ try{ if(ac){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=ok?1250:280; o.connect(g); g.connect(ac.destination); g.gain.value=.18; o.start(); o.stop(ac.currentTime+(ok?.12:.35)); } }catch(e){} try{ navigator.vibrate&&navigator.vibrate(ok?60:[90,60,90]); }catch(e){} };
  let h=null, last="", lastAt=0, busy=false, n=0;
  const close=async()=>{ try{ if(h){ await h.stop(); await h.clear(); } }catch(e){} ov.remove(); try{ ac&&ac.close(); }catch(e){} };
  ov.querySelector("#scdone").onclick=close;
  try{
    await loadScanLib();
    const F=window.Html5QrcodeSupportedFormats;
    h=new window.Html5Qrcode("scanreg",{formatsToSupport:[F.CODE_128,F.CODE_39,F.EAN_13,F.QR_CODE],useBarCodeDetectorIfSupported:true,verbose:false});
    await h.start({facingMode:"environment"},{fps:12,qrbox:(w,hh)=>({width:Math.floor(Math.min(320,w*.88)),height:Math.floor(Math.min(170,hh*.55))})},
      async text=>{ const code=String(text).trim(); const now=Date.now(); if(busy||(code===last&&now-lastAt<2500)) return; last=code; lastAt=now; busy=true;
        let res; try{ res=await onCode(code); }catch(e){ res={ok:false,msg:errText(e)}; }
        res=res||{ok:true,msg:code}; beep(res.ok); if(res.ok){ n++; ov.querySelector("#scnt").textContent=n; }
        const m=ov.querySelector("#scmsg"); m.textContent=res.msg; m.className="scmsg "+(res.ok?"ok":"bad");
        ov.querySelector("#sclog").insertAdjacentHTML("afterbegin",`<div class="${res.ok?"okc":"badc"}">${res.ok?"✓":"✕"} ${esc(res.msg)}</div>`);
        setTimeout(()=>{busy=false;},600); }, ()=>{});
  }catch(e){ const m=ov.querySelector("#scmsg"); m.className="scmsg bad";
    m.textContent="الكاميرا مش شغالة: "+((e&&e.message)||e)+". اسمح للمتصفح يستخدم الكاميرا من الإعدادات، أو اكتب رقم التوب بإيدك."; }
}
function rollInput(box, onRoll, placeholder="اعمل سكان أو اكتب رقم التوب واضغط Enter", title){
  box.innerHTML=`<div class="btools"><div class="search grow">${ICONS.search}<input type="search" id="rin" placeholder="${esc(placeholder)}" autocomplete="off" enterkeyhint="go"></div>${canScan()?`<button class="btn primary" id="rscan" type="button">${ICONS.camera} سكان بالكاميرا</button>`:""}</div>
    ${!canScan()&&IN_CLAUDE()?`<div class="sub">السكان بالكاميرا شغال من التطبيق على الموبايل. هنا اكتب الرقم أو استخدم قارئ باركود.</div>`:""}`;
  const inp=box.querySelector("#rin");
  const run=async v=>{ let r; try{ r=await onRoll(v); }catch(e){ r={ok:false,msg:errText(e)}; } if(r&&r.msg) toast(r.msg,!r.ok); };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=inp.value.trim(); if(v){ inp.value=""; run(v); } } };
  const sbtn=box.querySelector("#rscan"); if(sbtn) sbtn.onclick=()=>openScanner(onRoll,title);
  if(!/Mobi|Android|iPhone/i.test(navigator.userAgent)) setTimeout(()=>inp.focus(),50);
}

async function pollInbox(silent){

    S.inbox=d||S.inbox; paintBell();

  $("#rf").onclick=async()=>{ busyBtn($("#rf"),true); await pollInbox(true); drawInbox(); busyBtn($("#rf"),false); };
  $("#newmsg").onclick=()=>openSend("general","", "رسالة");
  if($("#notif")) $("#notif").onclick=async()=>{ try{ const p=await Notification.requestPermission(); toast(p==="granted"?"التنبيهات اتفعلت":"التنبيهات مش متفعلة"); viewInbox(); }catch(e){ toast("المتصفح ده مش بيدعم التنبيهات",true); } };
  $("#insubs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.inTab=b.dataset.k;$("#insubs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));drawInbox()};
  await pollInbox(true); drawInbox();
}
function drawInbox(){
  const box=$("#inbox"); if(!box) return;
  const me=S.me.department, ls=lastSeen();
  const hs=(S.inbox.handoffs||[]).filter(h=>S.inTab==="to"?h.to_dept===me:S.inTab==="from"?h.from_dept===me:S.inTab!=="alerts");
  const ns=(S.inbox.notifications||[]).filter(n=>S.inTab==="all"||S.inTab==="alerts").filter(n=>n.link_kind!=="handoff"||S.inTab==="alerts");
  const hHtml=hs.map(h=>{ const mine=h.to_dept===me||S.me.realRole==="admin"; const canAct=mine&&!S.me.preview&&h.status!=="done"&&h.status!=="rejected";
    return `<div class="item hand" data-h="${h.id}">
      <div class="item-top"><div class="item-title">${esc(h.from_name||"—")} ← ${esc(h.to_name)}</div><span class="chip st-${h.status==="open"?"reserved":h.status==="done"?"sold":h.status==="rejected"?"returned":"on_machine"}">${H_ST[h.status]||h.status}</span></div>
      ${h.link_title?`<div class="kv"><b>${esc(h.link_title)}</b></div>`:""}
      ${h.note?`<div class="hnote">${esc(h.note)}</div>`:""}${h.reply?`<div class="kv">الرد: ${esc(h.reply)}</div>`:""}
      <div class="kv"><span>${dt(h.created_at)}</span>${h.updated_at!==h.created_at?`<span>آخر تحديث ${dt(h.updated_at)}</span>`:""}</div>
      <div class="actions">${h.link_kind!=="general"&&h.link_id?`<button class="btn sm" data-open="${esc(h.link_kind)}|${esc(h.link_id)}">افتح</button>`:""}
        ${canAct&&h.status==="open"?`<button class="btn sm" data-hs="accepted">استلمت</button>`:""}${canAct?`<button class="btn sm ok" data-hs="done">خلصت</button><button class="btn sm danger" data-hs="rejected">رفض</button>`:""}
        <button class="btn sm" data-wa="${h.id}">${ICONS.share} واتساب</button></div><div data-m></div></div>`; }).join("");
  const nHtml=ns.map(n=>`<div class="item noti ${n.id>ls?"unread":""}" data-open="${esc(n.link_kind||"")}|${esc(n.link_id||"")}">
      <div class="item-top"><div class="item-title">${esc(n.title)}</div><span class="chip ${LVL_CLS[n.level]||"s"}">${esc(n.dept_name)}</span></div>
      ${n.body?`<div class="kv">${esc(n.body)}</div>`:""}<div class="kv"><span>${dt(n.created_at)}</span></div></div>`).join("");
  const extra=(S.inbox.overdue||S.inbox.expiring)?`<div class="msg err">${S.inbox.overdue?`${S.inbox.overdue} أمر تشغيل متأخر. `:""}${S.inbox.expiring?`${S.inbox.expiring} حجز بينتهي خلال يومين.`:""}</div>`:"";
  box.innerHTML = extra + (hHtml?`<div class="dsec">التحويلات</div><div class="card">${hHtml}</div>`:"") + (nHtml?`<div class="dsec">التنبيهات</div><div class="card">${nHtml}</div>`:"")
    + (!hHtml&&!nHtml?`<div class="state"><strong>مفيش حاجة جديدة</strong>أي طلب أو تحويل لقسمك هيظهر هنا، وهيوصلك تنبيه.</div>`:"");
  const mx=Math.max(0,...(S.inbox.notifications||[]).map(x=>x.id)); if(mx>ls) setTimeout(()=>{ setSeen(mx); paintBell(); },1500);
  box.onclick=async e=>{
    const o=e.target.closest("[data-open]"); if(o&&!e.target.closest("[data-hs],[data-wa]")){ const [k,id]=o.dataset.open.split("|"); if(k==="handoff"){ S.inTab="all"; drawInbox(); return; } if(k&&id) openLink(k,id); return; }
    const wa=e.target.closest("[data-wa]"); if(wa){ const h=S.inbox.handoffs.find(x=>x.id==wa.dataset.wa); const ds=await ensureDepts(); const to=ds.find(d=>d.code===h.to_dept);
      waSheet(to, `*تحويل من ${h.from_name||""} لـ ${h.to_name}*\n${h.link_title?h.link_title+"\n":""}${h.note||""}`); return; }
    const hs=e.target.closest("[data-hs]"); if(hs){ const it=hs.closest("[data-h]"), m=it.querySelector("[data-m]"); let reply=null;
      if(hs.dataset.hs!=="accepted"){ const inp=it.querySelector(".hreply"); if(!inp){ m.innerHTML=`<div class="row"><input type="text" class="hreply grow" placeholder="رد (اختياري)"><button class="btn sm primary" data-hs="${hs.dataset.hs}">تأكيد</button></div>`; return; } reply=inp.value; }
      try{ await rpc("fx_handoff_status",{p_id:+it.dataset.h,p_status:hs.dataset.hs,p_reply:reply}); toast("اتسجل"); await pollInbox(true); drawInbox(); }catch(err){ m.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`; } }
  };
}
async function openLink(kind,id){
  try{
    if(kind==="wo"){ const l=await rpc("fx_work_orders",{p_open_only:false}); const w=(l||[]).find(x=>String(x.id)===String(id)); if(w) openWODetail(w); else toast("الأمر ده مش موجود",true); }
    else if(kind==="reservation"){ const l=await rpc("fx_reservations",{p_status:"all"}); const r=(l||[]).find(x=>String(x.id)===String(id)); if(r) openResDetail(r); else toast("الحجز ده مش ظاهر لك",true); }
    else if(kind==="stock"){ const [w,sp,ck]=String(id).split("|"); if(!S.stock) await loadStock(); const r=S.stock.rows.find(x=>x.w===w&&x.spec===sp&&x.ck===ck&&x.free); if(r) openStockDetail(r); else openMaterial(String(sp).slice(0,5)); }
  }catch(e){ toast(errText(e),true); }
}
async function openSend(kind, ref, title){
  let ds; try{ ds=await ensureDepts(); }catch(e){ return toast(errText(e),true); }
  const opts=ds.filter(d=>d.code!==S.me.department&&d.role!=="viewer");
  let to=null;
  sheet(`<h2>ابعت لقسم</h2>${title&&kind!=="general"?`<div class="kv"><b>${esc(title)}</b></div>`:""}
   <div><div class="flabel">لمين؟</div><div class="reasons" id="sdept">${opts.map(d=>`<button type="button" data-k="${d.code}" aria-pressed="false">${esc(d.name)}</button>`).join("")}</div></div>
   <label><span>المطلوب</span><textarea id="snote" rows="3" placeholder="مثلاً: العميل عايز يستلم بكرة، جهّزوا الأتواب"></textarea></label>
   <div class="quickmsgs" id="sq">${["جهّزوا للتسليم","محتاجين تاريخ تسليم","راجعوا الكمية","العميل مستعجل","فيه مشكلة في اللون"].map(t=>`<button type="button" class="pill">${t}</button>`).join("")}</div>
   <div id="sm"></div><div class="row"><button class="btn primary grow" id="sgo">ابعت</button><button class="btn" onclick="closeSheet()">إلغاء</button></div>`);
  $("#sdept").onclick=e=>{const b=e.target.closest("button");if(!b)return;to=b.dataset.k;$("#sdept").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#sq").onclick=e=>{const b=e.target.closest("button");if(!b)return;const t=$("#snote");t.value=(t.value?t.value+" — ":"")+b.textContent;};
  $("#sgo").onclick=async()=>{ const m=$("#sm"); if(!to) return m.innerHTML=`<div class="msg err">اختار القسم.</div>`; const note=$("#snote").value.trim();
    if(kind==="general"&&!note) return m.innerHTML=`<div class="msg err">اكتب المطلوب.</div>`;
    $("#sgo").disabled=true;
    try{ await rpc("fx_send",{p_kind:kind,p_ref:ref,p_to_dept:to,p_note:note||null}); const d=ds.find(x=>x.code===to);
      const txt=`*${S.me.department_name||"قسم"} ← ${d.name}*\n${title&&kind!=="general"?title+"\n":""}${note}`;
      sheet(`<div class="msg ok">اتبعت لـ ${esc(d.name)} وهيوصلهم تنبيه على التطبيق.</div>${waButtons(d,txt)}<button class="btn" onclick="closeSheet()">تمام</button>`); bindWa();
      pollInbox(true);
    }catch(e){ m.innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; $("#sgo").disabled=false; } };
}
function waButtons(dept, text){
  const phone=(dept&&dept.whatsapp||"").replace(/\D/g,""); const href=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
  return `<div class="row"><a class="btn primary grow center" target="_blank" rel="noopener" href="${href}">${ICONS.share} ${phone?`ابعت واتساب لـ ${esc(dept.name)}`:"افتح واتساب"}</a><button class="btn grow" data-copy="${esc(text)}">انسخ الرسالة</button></div>
    ${phone?"":`<div class="sub">مفيش رقم واتساب متسجل للقسم ده. المدير يقدر يضيفه من الأساسيات ← الأقسام.</div>`}`;
}
function bindWa(){ document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("اتنسخت"); }catch(e){ toast("مش قادر أنسخ هنا",true); } }); }
function waSheet(dept, text){ sheet(`<h2>واتساب</h2><textarea rows="6" readonly>${esc(text)}</textarea>${waButtons(dept,text)}<button class="btn" onclick="closeSheet()">قفل</button>`); bindWa(); }

/* ============ reviewer feedback ============ */
function openFeedback(){
  let kind="ناقص"; let name=""; try{ name=localStorage.getItem("soffar_name")||""; }catch(e){}
  const SCR={home:"الرئيسية",stock:"الرصيد",res:"الحجوزات",wo:"التشغيل",warehouse:"المخزن",basics:"الأساسيات",reports:"التقارير",inbox:"التنبيهات",new:"طلب جديد"};
  sheet(`<h2>ملاحظة على التطبيق</h2><div class="sub">اكتب أي حاجة ناقصة أو غلط أو فكرة. الملاحظة بتوصل للإدارة على طول.</div>
   <div class="reasons" id="fk">${["ناقص","غلط","اقتراح","سؤال"].map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===kind}">${k}</button>`).join("")}</div>
   <label><span>في شاشة</span><input type="text" id="fs" value="${esc(SCR[S.tab]||S.tab)}"></label>
   <label><span>الملاحظة</span><textarea id="ft" rows="4"></textarea></label>
   <label><span>اسمك</span><input type="text" id="fn" value="${esc(name)}"></label>
   <div id="fm"></div><div class="row"><button class="btn primary grow" id="fgo">ابعت الملاحظة</button><button class="btn" onclick="closeSheet()">إلغاء</button></div>`);
  $("#fk").onclick=e=>{const b=e.target.closest("button");if(!b)return;kind=b.dataset.k;$("#fk").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#fgo").onclick=async()=>{ const t=$("#ft").value.trim(); if(!t) return $("#fm").innerHTML=`<div class="msg err">اكتب الملاحظة.</div>`;
    try{ localStorage.setItem("soffar_name",$("#fn").value.trim()); }catch(e){}
    $("#fgo").disabled=true;
    try{ await rpc("fx_feedback_add",{p_name:$("#fn").value.trim()||null,p_screen:$("#fs").value.trim(),p_kind:kind,p_text:t}); closeSheet(); toast("شكرًا، الملاحظة وصلت"); }
    catch(e){ $("#fm").innerHTML=`<div class="msg err">${esc(errText(e))}</div>`; $("#fgo").disabled=false; } };
}
async function bFeedback(box){
  const list=await rpc("fx_feedback_list")||[];
  const nw=list.filter(x=>x.status==="new").length;
  box.innerHTML=`<div class="sub">${nw} ملاحظة جديدة من ${list.length}</div>`+(list.length?`<div class="card">${list.map(f=>`<div class="item" data-id="${f.id}"><div class="item-top"><div class="item-title">${esc(f.kind||"")} · ${esc(f.screen||"")}</div><span class="chip ${f.status==="new"?"st-reserved":"st-sold"}">${f.status==="new"?"جديدة":"اتعملت"}</span></div>
     <div class="hnote">${esc(f.text)}</div><div class="kv"><span>${esc(f.name||"من غير اسم")}</span><span>${dt(f.at)}</span></div>
     <div class="actions"><button class="btn sm" data-done>${f.status==="new"?"علّم إنها اتعملت":"رجّعها جديدة"}</button></div></div>`).join("")}</div>`:`<div class="state"><strong>مفيش ملاحظات لسه</strong>زرار الملاحظة موجود فوق في كل شاشة.</div>`);
  box.onclick=async e=>{ const b=e.target.closest("[data-done]"); if(!b) return; try{ await rpc("fx_feedback_done",{p_id:+b.closest("[data-id]").dataset.id}); bFeedback(box); }catch(err){ toast(errText(err),true); } };
}

/* ============ departments & links (admin) ============ */
const appBase = () => APP_URL || (IN_CLAUDE()? "" : location.origin+location.pathname);
async function bDepts(box){
  const [ds, keys]=await Promise.all([rpc("fx_departments"), rpc("fx_keys")]); S.depts=ds;
  const base=appBase();
  box.innerHTML=`<section class="card pad stack"><h2>الأقسام وأرقام الواتساب</h2><div class="sub">الرقم بالكود الدولي من غير +، مثلاً 2010xxxxxxxx. التحويلات والتنبيهات بتتبعت للقسم على الرقم ده.</div>
    ${ds.filter(d=>d.role!=="viewer").map(d=>`<div class="row dline" data-code="${d.code}"><label class="grow"><span>اسم القسم</span><input type="text" data-f="name" value="${esc(d.name)}"></label><label class="grow"><span>واتساب</span><input type="tel" data-f="wa" value="${esc(d.whatsapp||"")}" inputmode="tel"></label><button class="btn sm" data-save style="align-self:flex-end">حفظ</button></div>`).join("")}</section>
   <section class="card pad stack"><h2>روابط الدخول</h2>
    <div class="sub">كل رابط بيدخّل صاحبه على التطبيق بصلاحيات قسمه من غير باسورد. ابعت لكل موظف رابط قسمه، ولو حد ساب الشغل اقفل رابطه.</div>
    ${base?"":`<div class="msg err">الروابط هتشتغل بعد ما التطبيق يترفع على الإنترنت. لحد كده تقدر تعمل المفاتيح.</div>`}
    <div class="row"><label class="grow"><span>القسم</span><select id="kd">${ds.map(d=>`<option value="${d.code}">${esc(d.name)}</option>`).join("")}</select></label><label class="grow"><span>اسم الموظف أو الوصف</span><input type="text" id="kl" placeholder="مثلاً: أحمد مبيعات"></label><button class="btn primary" id="kadd" style="align-self:flex-end">اعمل رابط</button></div>
    <div id="knew"></div>
    <div class="card">${keys.map(k=>`<div class="item" data-key="${esc(k.key)}"><div class="item-top"><div class="item-title">${esc(k.label||"من غير اسم")} · ${esc(k.dept_name)}</div><span class="chip ${k.active?"st-sold":"st-cancelled"}">${k.active?"شغال":"مقفول"}</span></div>
      <div class="kv"><span>آخر استخدام ${k.last_used?dt(k.last_used):"لسه"}</span></div>
      <div class="actions">${base?`<button class="btn sm" data-link>انسخ الرابط</button><button class="btn sm" data-walink>${ICONS.share} ابعته واتساب</button>`:""}<button class="btn sm ${k.active?"danger":""}" data-toggle>${k.active?"اقفل الرابط":"افتح الرابط"}</button></div></div>`).join("")}</div>
   </section>`;
  const link=k=>`${base}#k=${k}`;
  box.onclick=async e=>{
    const sv=e.target.closest("[data-save]"); if(sv){ const r=sv.closest(".dline"); try{ await rpc("fx_dept_save",{p_code:r.dataset.code,p_name:r.querySelector('[data-f="name"]').value,p_whatsapp:r.querySelector('[data-f="wa"]').value}); S.depts=null; toast("اتحفظ"); }catch(err){ toast(errText(err),true); } return; }
    const it=e.target.closest("[data-key]"); if(!it) return; const key=it.dataset.key;
    if(e.target.closest("[data-link]")){ try{ await navigator.clipboard.writeText(link(key)); toast("الرابط اتنسخ"); }catch(err){ waSheet(null, link(key)); } }
    if(e.target.closest("[data-walink]")){ const k=keys.find(x=>x.key===key); waSheet(null, `رابط تطبيق مبيعات صفار (${k.dept_name}${k.label?" · "+k.label:""}):\n${link(key)}\nافتحه من الموبايل، ومن قايمة المتصفح اختار «إضافة إلى الشاشة الرئيسية».`); }
    if(e.target.closest("[data-toggle]")){ try{ await rpc("fx_key_toggle",{p_key:key}); bDepts(box); }catch(err){ toast(errText(err),true); } }
  };
  $("#kadd").onclick=async()=>{ try{ const x=await rpc("fx_key_create",{p_department:$("#kd").value,p_label:$("#kl").value}); toast("الرابط اتعمل"); await bDepts(box);
      $("#knew").innerHTML=base?`<div class="msg ok">الرابط الجديد: <span class="num linkline">${esc(link(x.key))}</span></div>`:""; }catch(err){ toast(errText(err),true); } };
}

if (sb) sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ S.me=null; S.stock=null; renderLogin(); } });
boot();
</script>
</body>
